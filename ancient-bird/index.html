:root{--ink:#3a2a14;--ink2:#6b5636;--paper:#fff8e8;--paper2:#f6ead0;--line:rgba(80,55,20,.18);--green:#3f8f3a;--green2:#2f6f2c;--orange:#e8902a;--red:#d24a3a;--blue:#3a86c8;
  --sa-t:var(--ttg-sa-top,env(safe-area-inset-top,0px));--sa-r:var(--ttg-sa-right,env(safe-area-inset-right,0px));--sa-b:var(--ttg-sa-bottom,env(safe-area-inset-bottom,0px));--sa-l:var(--ttg-sa-left,env(safe-area-inset-left,0px));
  --font:ui-rounded,"SF Pro Rounded","Nunito","Varela Round",system-ui,-apple-system,"Segoe UI",sans-serif;--emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#3c5a2a;color:var(--ink);font:500 15px/1.35 var(--font);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hud{position:fixed;inset:0;pointer-events:none;z-index:5}
.hud>*{pointer-events:auto}
.top{position:absolute;left:calc(8px + var(--sa-l));right:calc(8px + var(--sa-r));top:calc(6px + var(--sa-t));display:flex;gap:6px;align-items:center;pointer-events:none}
.top>*{pointer-events:auto}
.top .sp{flex:1;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:5px;height:36px;padding:0 11px;border-radius:12px;border:2px solid rgba(60,40,15,.25);background:var(--paper);box-shadow:0 2px 0 rgba(60,40,15,.25);font-weight:700;white-space:nowrap}
.chip b{font-weight:800}
.chip.bad b{color:var(--red)}
.chip .e{font-family:var(--emoji);font-size:16px}
#starChip{flex-direction:column;justify-content:center;gap:2px;padding:0 10px;min-width:96px}
#stars{font-size:15px;letter-spacing:1px;color:#e0a21a;line-height:1;text-shadow:0 1px 0 rgba(0,0,0,.15)}
.bar{display:block;width:100%;height:5px;border-radius:5px;background:rgba(60,40,15,.15);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f2b51e,#f6d25a);border-radius:5px}
#goalChip{max-width:min(36vw,300px);overflow:hidden;font-weight:600;font-size:13px}
#goalChip span:last-child{overflow:hidden;text-overflow:ellipsis}
.speed{display:flex;border-radius:12px;border:2px solid rgba(60,40,15,.25);background:var(--paper);box-shadow:0 2px 0 rgba(60,40,15,.25);overflow:hidden;height:36px}
.speed button{border:0;background:none;width:34px;font-size:14px;font-weight:800;color:var(--ink2)}
.speed button.on{background:var(--green);color:#fff}
.tools{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(6px + var(--sa-b));display:flex;gap:4px;padding:5px;border-radius:16px;background:var(--paper);border:2px solid rgba(60,40,15,.25);box-shadow:0 3px 0 rgba(60,40,15,.25);max-width:calc(100vw - 16px - var(--sa-l) - var(--sa-r));overflow-x:auto;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tool{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;width:56px;height:50px;border-radius:12px;border:0;background:none;padding:0;font-size:10.5px;font-weight:700;color:var(--ink2);gap:1px}
.tool .e{font-family:var(--emoji);font-size:21px;line-height:1}
.tool.on{background:var(--green);color:#fff;box-shadow:inset 0 -3px 0 var(--green2)}
.sub{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(70px + var(--sa-b));display:flex;gap:5px;padding:5px;border-radius:14px;background:rgba(255,248,232,.97);border:2px solid rgba(60,40,15,.25);box-shadow:0 3px 0 rgba(60,40,15,.2);max-width:calc(100vw - 16px - var(--sa-l) - var(--sa-r));overflow-x:auto;scrollbar-width:none;align-items:stretch}
.sub::-webkit-scrollbar{display:none}
.sub[hidden]{display:none}
.opt{flex:none;display:flex;align-items:center;gap:6px;height:42px;padding:0 10px;border-radius:10px;border:2px solid transparent;background:var(--paper2);font-weight:700;font-size:13px;white-space:nowrap}
.opt .e{font-family:var(--emoji);font-size:18px}
.opt small{font-weight:600;color:var(--ink2);font-size:11.5px}
.opt.on{border-color:var(--green);background:#e4f2d6}
.opt.locked{opacity:.45}
.opt img,.opt canvas{height:34px;width:auto}
.sub .note{display:flex;align-items:center;padding:0 8px;font-size:12.5px;font-weight:600;color:var(--ink2);white-space:nowrap}
.panel{position:fixed;z-index:20;right:calc(8px + var(--sa-r));top:calc(48px + var(--sa-t));bottom:calc(8px + var(--sa-b));width:min(400px,48vw);display:flex;flex-direction:column;border-radius:18px;background:var(--paper);border:2px solid rgba(60,40,15,.3);box-shadow:0 6px 0 rgba(60,40,15,.25),0 12px 30px rgba(0,0,0,.25);overflow:hidden}
.panel[hidden]{display:none}
.panel.over{z-index:50}
.phead{display:flex;align-items:center;gap:8px;padding:10px 10px 8px 14px;border-bottom:2px solid var(--line);background:var(--paper2)}
.phead h2{flex:1;margin:0;font-size:18px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{flex:none;width:36px;height:36px;border-radius:10px;border:2px solid rgba(60,40,15,.2);background:var(--paper);font-weight:800;font-size:16px}
.pbody{flex:1;overflow-y:auto;padding:10px 12px 14px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.tabs{display:flex;gap:5px;margin:0 0 10px;flex-wrap:wrap}
.tab{flex:1;min-width:0;height:36px;border-radius:10px;border:2px solid rgba(60,40,15,.18);background:var(--paper2);font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.tab.on{background:var(--green);border-color:var(--green2);color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 6px 8px;border-radius:12px;border:2px solid rgba(60,40,15,.16);background:#fffdf6;text-align:center}
.card canvas{width:100%;height:auto;aspect-ratio:3/2}
.card b{font-size:13px;line-height:1.15}
.card small{font-size:12px;font-weight:700;color:var(--green2)}
.card.locked{background:#efe6d2}
.card.locked canvas{filter:grayscale(1) brightness(.75);opacity:.55}
.card.locked small{color:var(--ink2)}
.lock{position:absolute;top:6px;right:6px;font-size:11px;font-weight:800;background:#3a2a14;color:#ffd75a;border-radius:8px;padding:2px 6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:6px 14px;border-radius:12px;border:2px solid var(--green2);background:var(--green);color:#fff;font-weight:800;box-shadow:0 3px 0 var(--green2)}
.btn.alt{background:var(--paper2);color:var(--ink);border-color:rgba(60,40,15,.25);box-shadow:0 3px 0 rgba(60,40,15,.25)}
.btn.warn{background:var(--red);border-color:#8f2a20;box-shadow:0 3px 0 #8f2a20}
.btn:disabled{opacity:.45}
.btn .e{font-family:var(--emoji)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.row .btn{flex:1}
.sec{margin:12px 0 6px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.stat{display:grid;grid-template-columns:26px 1fr 44px;align-items:center;gap:6px;margin:5px 0;font-size:13.5px;font-weight:700}
.stat .e{font-family:var(--emoji);font-size:16px;text-align:center}
.stat .bar{height:9px}
.stat .bar i{background:linear-gradient(90deg,#57b04a,#8ed46a)}
.stat .bar i.mid{background:linear-gradient(90deg,#e8a62a,#f2c94a)}
.stat .bar i.low{background:linear-gradient(90deg,#d24a3a,#ee7a5a)}
.stat span:last-child{text-align:right;color:var(--ink2);font-size:12.5px}
.big{display:block;width:100%;height:auto;border-radius:14px;background:linear-gradient(#e8f2d6,#d6e6b8)}
.big.paleo{background:linear-gradient(#f4e2c6,#e6c99a)}
.big.ice{background:linear-gradient(#eef6fb,#d2e6f2)}
.facts{margin:6px 0;padding-left:20px}
.facts li{margin:5px 0;font-size:14px;font-weight:600}
.myth{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}
.myth div{padding:8px 10px;border-radius:12px;font-size:13px;font-weight:600}
.myth div b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.myth .m{background:#fbe1da;color:#7a2a1a}
.myth .r{background:#dff0d4;color:#24521f}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13.5px;margin:6px 0}
.kv dt{font-weight:800;color:var(--ink2)}
.kv dd{margin:0;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:800;color:#fff}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:12px;border:2px solid rgba(60,40,15,.14);background:#fffdf6;text-align:left;width:100%}
.item canvas{width:64px;height:42px;flex:none}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-size:14px}
.item .t small{display:block;font-size:12px;font-weight:600;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .e{font-family:var(--emoji);font-size:22px;flex:none;width:30px;text-align:center}
.say{margin:6px 0;padding:8px 12px;border-radius:14px;background:#eef6e6;font-weight:700;font-size:14px}
.say.bad{background:#fbe6d8}
input.name{width:100%;height:38px;border-radius:10px;border:2px solid rgba(60,40,15,.25);background:#fff;padding:0 10px;font:700 15px var(--font);color:var(--ink)}
.help{font-size:13.5px;font-weight:600;color:var(--ink2)}
.toast{position:fixed;z-index:30;left:50%;top:calc(48px + var(--sa-t));transform:translateX(-50%);display:flex;flex-direction:column;gap:4px;align-items:center;pointer-events:none;width:min(440px,72vw)}
.toast div{padding:5px 12px;border-radius:12px;background:rgba(40,28,12,.88);color:#fff;font-weight:700;font-size:12.5px;line-height:1.3;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.25);animation:tin .25s ease-out}
.toast div.good{background:rgba(47,111,44,.95)}
.toast div.bad{background:rgba(160,46,32,.95)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
.screen{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:calc(12px + var(--sa-t)) calc(12px + var(--sa-r)) calc(12px + var(--sa-b)) calc(12px + var(--sa-l));background:radial-gradient(ellipse at center,rgba(20,30,10,.15),rgba(20,30,10,.55))}
.screen[hidden]{display:none}
.menucard{display:flex;flex-direction:column;align-items:stretch;gap:9px;width:min(400px,92vw);max-height:100%;overflow-y:auto;padding:18px 18px 16px;border-radius:24px;background:var(--paper);border:3px solid rgba(60,40,15,.3);box-shadow:0 8px 0 rgba(60,40,15,.3),0 20px 50px rgba(0,0,0,.35);text-align:center}
.logo{display:flex;flex-direction:column;align-items:center;gap:2px;margin:0 0 4px}
.logo canvas{width:220px;height:110px}
.logo h1{margin:0;font-size:30px;line-height:1;font-weight:900;color:#2f5f22;letter-spacing:-.5px;text-shadow:0 2px 0 #f2d48a}
.logo p{margin:2px 0 0;font-size:13.5px;font-weight:700;color:var(--ink2)}
.menucard .btn{min-height:48px;font-size:17px}
.eras{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.cursor{position:fixed;z-index:6;width:34px;height:34px;margin:-17px 0 0 -17px;pointer-events:none;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.45),inset 0 0 0 2px rgba(0,0,0,.35)}
.cursor::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.5)}
.cursor[hidden]{display:none}
.padhint{position:fixed;z-index:6;left:calc(10px + var(--sa-l));bottom:calc(72px + var(--sa-b));display:flex;gap:10px;padding:5px 10px;border-radius:10px;background:rgba(40,28,12,.78);color:#fff;font-size:12px;font-weight:700;pointer-events:none}

/* world map, regions, new-park animal strip */
.worldmap{width:100%;height:auto;display:block;border-radius:14px;cursor:pointer;margin:2px 0 8px;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.regions{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.regions .btn{margin:0;font-size:13.5px;padding:9px 6px}
.strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.strip figure{margin:0;flex:none;width:92px;text-align:center}
.strip canvas{width:92px;height:auto;aspect-ratio:3/2;background:#eef3dc;border-radius:10px}
.strip figcaption{font-size:11px;line-height:1.15;font-weight:700;color:var(--ink2)}
.lock.kind{background:#eef6fb;color:#1f4a66;font-size:12px}
.chip.bad{background:#fbe1d8}

/* hybrid lab part pickers */
.strip.pick .pk{flex:none;width:84px;border:2px solid rgba(60,40,15,.18);background:#fffaf0;border-radius:12px;padding:3px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;font:inherit;color:var(--ink)}

.strip.pick .pk canvas{width:80px;height:auto;aspect-ratio:3/2;background:none}
.strip.pick .pk small{font-size:11px;font-weight:800;line-height:1.1;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.strip.pick .pk .e{font-size:28px;line-height:53px}

/* Time Travel controls */
.tthud{position:fixed;inset:0;z-index:7;pointer-events:none}
.tthud[hidden]{display:none}
.ttstats{position:absolute;left:calc(8px + var(--sa-l));top:calc(8px + var(--sa-t));width:min(230px,52vw);background:var(--paper);border:2px solid rgba(60,40,15,.25);border-radius:14px;padding:6px 10px 4px;box-shadow:0 3px 0 rgba(60,40,15,.2);pointer-events:auto}
.ttstats b{display:block;font-size:14px}
.ttstats small{display:block;font-size:11px;font-weight:700;color:var(--ink2);margin-bottom:2px}
.ttstats .stat{margin:2px 0}
#ttHome{position:absolute;right:calc(8px + var(--sa-r));top:calc(8px + var(--sa-t));pointer-events:auto}
.ttbtns{position:absolute;right:calc(14px + var(--sa-r));bottom:calc(16px + var(--sa-b));display:flex;align-items:flex-end;gap:12px;pointer-events:auto}
.ttb{width:68px;height:68px;border-radius:50%;border:3px solid rgba(60,40,15,.45);background:#fff7e4;box-shadow:0 4px 0 rgba(60,40,15,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;font:inherit;color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
.ttb.big{width:88px;height:88px;background:#ffd86a}
.ttb .e{font-size:26px;line-height:1}
.ttb.big .e{font-size:34px}
.ttb small{font-size:11px;font-weight:800}
.ttb:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(60,40,15,.3)}
.ttjoy{position:fixed;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:3px solid rgba(255,255,255,.7);background:rgba(255,255,255,.12);pointer-events:none}
.ttjoy[hidden]{display:none}
.ttjoy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.tthelp{position:absolute;left:calc(16px + var(--sa-l));bottom:calc(24px + var(--sa-b));background:rgba(40,28,12,.78);color:#fff;font-weight:800;font-size:13px;padding:6px 10px;border-radius:10px}
.tthelp[hidden]{display:none}
body.tt .toast{top:calc(52px + var(--sa-t));left:auto;right:calc(8px + var(--sa-r));transform:none;width:min(360px,46vw);align-items:flex-end}
@media (orientation:portrait){body.tt .toast{top:calc(150px + var(--sa-t));left:50%;right:auto;transform:translateX(-50%);width:92vw;align-items:center}}

/* =================== polished mobile-game theme =================== */
:root{--navy:#16283a;--navy2:#2a4560;--gold1:#ffd56a;--gold2:#f08a12}
.ico{display:inline-flex;line-height:0}
.ic{width:24px;height:24px;flex:none}
.top{gap:7px;flex-wrap:wrap;row-gap:6px}
.top .sp{flex:1}
.top .sp1,.top .brk{display:none}
.res{position:relative;display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 13px 0 3px;border-radius:20px;border:2px solid rgba(255,255,255,.3);background:linear-gradient(var(--navy2),var(--navy));box-shadow:0 3px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.22);color:#fff;font-weight:900;font-size:16px;text-shadow:0 2px 0 rgba(0,0,0,.45);white-space:nowrap}
.res .ic{width:31px;height:31px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.3))}
.res.bad b{color:#ff9d88}
#starChip{flex-direction:column;align-items:stretch;justify-content:center;gap:3px;padding:0 11px;min-width:0}
#stars{display:flex;gap:1px;line-height:0}
#stars .ic{width:17px;height:17px}
#starChip .bar{height:5px;background:rgba(0,0,0,.4)}
.bar i{background:linear-gradient(90deg,#ffcf3a,#fff3a0)}
.quest{display:inline-flex;align-items:center;gap:6px;height:38px;max-width:min(34vw,320px);padding:0 12px 0 5px;border-radius:14px;border:2px solid #fff;background:linear-gradient(#fff8e2,#f3dca4);box-shadow:0 3px 0 rgba(0,0,0,.3);color:#4a3518;font-weight:800;font-size:13px;overflow:hidden}
.quest .ic{width:26px;height:26px}
.quest #goalText{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rb{position:relative;width:42px;height:42px;flex:none;border-radius:50%;padding:0;border:2px solid rgba(255,255,255,.32);background:radial-gradient(circle at 50% 28%,#45698c,var(--navy) 72%);box-shadow:0 3px 0 rgba(0,0,0,.38);display:inline-flex;align-items:center;justify-content:center}
.rb .ic{width:24px;height:24px}
#wxChip .ic{width:32px;height:32px}
#wxChip.bad{background:radial-gradient(circle at 50% 28%,#c0574a,#6a1e16 72%)}
#speedBtn small{position:absolute;right:-5px;bottom:-5px;min-width:22px;height:18px;padding:0 4px;border-radius:9px;background:linear-gradient(var(--gold1),var(--gold2));border:2px solid #fff;color:#3a2200;font-size:10.5px;font-weight:900;line-height:14px;text-align:center}
#pauseBtn.on{background:radial-gradient(circle at 50% 28%,#ffd56a,#e07a0c 72%)}
.chip.bad{background:none}
/* bottom: four big buttons */
.tools{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(8px + var(--sa-b));display:flex;gap:10px;align-items:flex-end;padding:0;border:0;border-radius:0;background:none;box-shadow:none;overflow:visible;max-width:none}
.mb{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;width:64px;border:0;background:none;padding:0;color:#fff;font-weight:900;font-size:12.5px;text-shadow:0 2px 0 rgba(0,0,0,.65),0 0 8px rgba(0,0,0,.55)}
.mb .disc{width:56px;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;border:3px solid #fff;background:linear-gradient(var(--gold1),var(--gold2));box-shadow:0 4px 0 #a85608,0 7px 14px rgba(0,0,0,.35),inset 0 3px 0 rgba(255,255,255,.45);transition:transform .08s}
.mb .disc .ic{width:36px;height:36px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.mb.green .disc{background:linear-gradient(#a6ee74,#36a12a);box-shadow:0 4px 0 #1f6a16,0 7px 14px rgba(0,0,0,.35),inset 0 3px 0 rgba(255,255,255,.45)}
.mb.blue .disc{background:linear-gradient(#8ddcff,#2a86d8);box-shadow:0 4px 0 #1a5590,0 7px 14px rgba(0,0,0,.35),inset 0 3px 0 rgba(255,255,255,.45)}
.mb.purple .disc{background:linear-gradient(#d7a8ff,#7c3fd0);box-shadow:0 4px 0 #4d2290,0 7px 14px rgba(0,0,0,.35),inset 0 3px 0 rgba(255,255,255,.45)}
.mb.red .disc{background:linear-gradient(#ff9d88,#e0392b);box-shadow:0 4px 0 #8f2116,0 7px 14px rgba(0,0,0,.35),inset 0 3px 0 rgba(255,255,255,.45)}
.mb.on .disc{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.5),0 0 0 4px #ffe27a,0 6px 14px rgba(0,0,0,.35)}
.mb:active .disc{transform:translateY(3px)}
.mb[hidden]{display:none}
/* build tray */
.tray{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(88px + var(--sa-b));display:flex;gap:6px;padding:6px;border-radius:18px;background:linear-gradient(var(--navy2),var(--navy));border:2px solid rgba(255,255,255,.3);box-shadow:0 4px 0 rgba(0,0,0,.35);max-width:calc(100vw - 12px - var(--sa-l) - var(--sa-r));overflow-x:auto;scrollbar-width:none}
.tray[hidden]{display:none}
.tray::-webkit-scrollbar{display:none}
.tb{flex:none;width:60px;height:60px;border-radius:14px;border:2px solid rgba(255,255,255,.22);background:linear-gradient(#3e6283,#22394f);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#fff;font-weight:800;font-size:11px;padding:0;box-shadow:inset 0 2px 0 rgba(255,255,255,.15)}
.tb .ic{width:32px;height:32px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.3))}
.tb.on{background:linear-gradient(var(--gold1),var(--gold2));border-color:#fff;color:#3a2200}
/* options for the chosen tool */
.sub{bottom:calc(88px + var(--sa-b));background:linear-gradient(var(--navy2),var(--navy));border:2px solid rgba(255,255,255,.3);box-shadow:0 4px 0 rgba(0,0,0,.35);border-radius:16px;padding:6px;gap:6px}
.hud.tray-open .sub{bottom:calc(166px + var(--sa-b))}
.opt{height:52px;padding:0 10px 0 6px;border-radius:12px;border:2px solid #e8d7ae;background:linear-gradient(#fffdf5,#f1e3c2);color:#3a2a14;font-weight:800;font-size:13px;box-shadow:inset 0 2px 0 #fff}
.opt .ic{width:32px;height:32px}
.opt canvas{height:44px;width:auto}
.opt small{color:#7a5a20;font-weight:800}
.opt .sw{width:30px;height:30px;border-radius:9px;border:2px solid rgba(0,0,0,.35);box-shadow:inset 0 3px 0 rgba(255,255,255,.35)}
.opt.on{background:linear-gradient(#fff0b8,#ffcf3a);border-color:#fff;box-shadow:0 0 0 2px #e08a0c}
.opt > span.lbl{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1}
.sub .note{color:#fff;font-weight:800;text-shadow:0 1px 0 rgba(0,0,0,.5)}
/* panels */
.panel{background:linear-gradient(#fffaf0,#f3e7cc);border:3px solid #fff;border-radius:22px;box-shadow:0 6px 0 rgba(0,0,0,.28),0 14px 34px rgba(0,0,0,.38)}
.phead{background:linear-gradient(#45b0f5,#1f6fc0);border-bottom:3px solid #17558f;padding:9px 9px 9px 16px}
.phead h2{color:#fff;font-weight:900;font-size:19px;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.x{width:38px;height:38px;border-radius:50%;border:3px solid #fff;padding:0;background:linear-gradient(#ff9d88,#e0392b);box-shadow:0 3px 0 #8f2116;display:inline-flex;align-items:center;justify-content:center}
.x .ic{width:20px;height:20px}
.btn{min-height:44px;border-radius:14px;border:0;background:linear-gradient(#a6ee74,#36a12a);box-shadow:0 4px 0 #1f6a16,inset 0 2px 0 rgba(255,255,255,.45);color:#fff;font-weight:900;text-shadow:0 2px 0 rgba(0,0,0,.3);transition:transform .06s}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #1f6a16}
.btn.alt{background:linear-gradient(#ffffff,#ece1c8);box-shadow:0 4px 0 #bba77a,inset 0 2px 0 #fff;color:#4a3518;text-shadow:none}
.btn.alt:active{box-shadow:0 2px 0 #bba77a}
.btn.warn{background:linear-gradient(#ff9d88,#e0392b);box-shadow:0 4px 0 #8f2116,inset 0 2px 0 rgba(255,255,255,.4)}
.btn.buy{background:linear-gradient(var(--gold1),var(--gold2));box-shadow:0 4px 0 #a85608,inset 0 2px 0 rgba(255,255,255,.45)}
.btn .ic{width:24px;height:24px}
.tabs{gap:6px}
.tab{height:38px;border-radius:12px;border:2px solid #e1cf9f;background:linear-gradient(#fffaf0,#efe2bf);color:#5a4220;font-weight:900}
.tab.on{background:linear-gradient(var(--gold1),var(--gold2));border-color:#fff;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3);box-shadow:0 3px 0 #a85608}
.card{border-radius:16px;background:#fff;border:2px solid #ecdfbf;box-shadow:0 3px 0 #dccb9f}
.card b{font-weight:900}
.card.locked{background:#ece3cf}
.lock{background:#1d2633;color:#ffd56a;border:2px solid #fff;border-radius:10px}
.item{border-radius:14px;background:#fff;border:2px solid #ecdfbf;box-shadow:0 2px 0 #dccb9f}

.say.bad{background:#fff3ee;border-color:#f3b8a6}
.sec{color:#1f6fc0;font-weight:900}
.stat .e .ic{width:22px;height:22px}
.stat .bar{height:11px;border-radius:6px;background:#e5d9bd;box-shadow:inset 0 2px 0 rgba(0,0,0,.12)}
input.name{border:2px solid #e1cf9f;border-radius:12px;height:42px}
/* messages */
.toast div{background:linear-gradient(var(--navy2),var(--navy));border:2px solid rgba(255,255,255,.35);border-radius:14px;font-weight:800;font-size:13px;padding:6px 14px;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.toast div.good{background:linear-gradient(#5ecb48,#2e8f24)}
.toast div.bad{background:linear-gradient(#f0695a,#b8291c)}
/* title screen */
.menucard{background:linear-gradient(#fffaf0,#f3e7cc);border:4px solid #fff;border-radius:26px;box-shadow:0 8px 0 rgba(0,0,0,.3),0 20px 50px rgba(0,0,0,.4)}

.menucard .btn.big{min-height:60px;font-size:22px;background:linear-gradient(var(--gold1),var(--gold2));box-shadow:0 5px 0 #a85608,inset 0 3px 0 rgba(255,255,255,.45)}

/* tutorial pointer */

.hint[hidden]{display:none}
.hint .hb{max-width:min(240px,70vw);padding:7px 12px;border-radius:14px;background:#fff;border:3px solid #ffcf3a;box-shadow:0 4px 0 rgba(0,0,0,.25);color:#3a2a14;font-weight:900;font-size:13.5px;text-align:center}
.hint .ha{width:0;height:0;margin-top:2px;border-left:14px solid transparent;border-right:14px solid transparent;border-top:20px solid #ffcf3a;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25));animation:bob .7s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(-4px)}to{transform:translateY(5px)}}
@media (orientation:portrait){
  .top .sp1,.top .brk{display:block}
  .top .brk{flex-basis:100%;height:0}
  #moneyChip{order:1}#starChip{order:2}.top .sp1{order:3}#menuChip{order:4}.top .brk{order:5}

.ttstats b{text-shadow:0 2px 0 rgba(0,0,0,.4)}
.ttstats small{color:#cfe3f5}
.ttstats .stat .bar{background:rgba(0,0,0,.35)}
.ttb{background:linear-gradient(#ffffff,#e6dcc4);border:3px solid #fff;box-shadow:0 4px 0 #9c8a62,0 6px 14px rgba(0,0,0,.35)}

/* long animal names wrap neatly inside their boxes */

.card b.long{font-size:12px;letter-spacing:-.2px}

/* while drawing on the map, the bottom menus fade so you can see (and draw) under them */

/* build mode: one row of tools at the bottom (with Done) instead of the tools + main buttons stacked */

<script>/* ---------- Animal art, built from parts ----------
   Every animal is a body plan (two legs or four), a torso, a neck, a head, a tail, legs, and extras on its back.
   Parts are filled shapes; one outline goes around the whole animal afterwards, so parts join smoothly.
   Because animals are made of parts, hybrids can mix a head from one animal with the body of another.
   Drawn from the side, facing right, standing on y = 0, in "design units" (scaled per animal).
   a = { ph: step phase, mv: walking 0..1, hd: head down 0..1, up: head up 0..1, roar: mouth open 0..1,

  const mix = (a, b, t) => { const p = hx2(a), q = hx2(b); return rgb(p.map((v, i) => lerp(v, q[i], t))); };

  const rgba = (c, al) => { const p = hx2(c); return `rgba(${p[0]},${p[1]},${p[2]},${al})`; };

  /* ---------- path helpers ---------- */
  // smooth closed shape through points; a point with [2] = 1 stays a sharp corner
  function smooth(ctx, pts) {
    const n = pts.length;
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 0; i < n; i++) {
      const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
      const t1 = p1[2] ? 0 : 1, t2 = p2[2] ? 0 : 1;

  function curve(ctx, pts, start) {

      ctx.bezierCurveTo(p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6, p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6, p2[0], p2[1]);

  function qpts(p0, c, p1, n) { const out = []; for (let i = 0; i <= n; i++) { const t = i / n, u = 1 - t; out.push([u * u * p0[0] + 2 * u * t * c[0] + t * t * p1[0], u * u * p0[1] + 2 * u * t * c[1] + t * t * p1[1]]); } return out; }

  function line(ctx, pts, w, col) { ctx.beginPath(); curve(ctx, pts, true); ctx.lineWidth = w; ctx.strokeStyle = col; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke(); }

  /* ---------- a leg: one smooth shape from the hip (inside the body) down to the foot ---------- */
  function legShape(ctx, chain, hw, fill) {
    const n = chain.length, Lp = [], Rp = [];
    for (let i = 0; i < n; i++) {
      const a = chain[Math.max(0, i - 1)], b = chain[Math.min(n - 1, i + 1)];
      let dx = b[0] - a[0], dy = b[1] - a[1]; const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
      Lp.push([chain[i][0] - dy * hw[i], chain[i][1] + dx * hw[i]]); Rp.push([chain[i][0] + dy * hw[i], chain[i][1] - dx * hw[i]]);

  }

  function bipedLeg(ctx, R, a, phase, fill, near, toe) {

    const fx = hx + 4 + s * L.stride * a.mv, fy = -Math.max(0, c) * L.lift * a.mv;
    const ax = fx - L.l3 * 0.3, ay = fy - L.l3 * 0.95;

    let tf = fill;

      tf = near ? L.scaly : dk(L.scaly, 0.28);

      legShape(ctx, [k0, [lerp(k0[0], ax, 0.5), lerp(k0[1], ay, 0.5)], [ax, ay], [fx, fy - 1]], [w * 0.36, w * 0.33, w * 0.3, w * 0.28], tf);
      ctx.lineWidth = Math.max(0.4, w * 0.05); ctx.strokeStyle = near ? 'rgba(255,250,230,.35)' : 'rgba(255,250,230,.15)'; ctx.lineCap = 'round';
      for (let i = 1; i <= 4; i++) { const t = i / 5, x = lerp(ax, fx, t), y = lerp(ay, fy - 1, t); ctx.beginPath(); ctx.moveTo(x - w * 0.12, y); ctx.lineTo(x + w * 0.12, y - w * 0.03); ctx.stroke(); }

      ctx.beginPath(); ctx.moveTo(fx - w * 0.2, fy - w * 0.32); ctx.lineTo(x2, y2 - w * 0.16); ctx.lineTo(x2 + 0.5, y2 + 0.3); ctx.lineTo(fx - w * 0.2, fy + 0.3); ctx.closePath(); ctx.fillStyle = tf; ctx.fill();

  }

      ell(ctx, fx + w * 0.12, fy - w * 0.02, w * 0.56, w * 0.28, 0, fill);

  function drawArthro(ctx, R, a) {
    const c = R.c, n = 14, segW = 8.4, t = a.t || 0, L = R.line;
    const wav = (i) => Math.sin(i * 0.7 - (a.ph || 0) * 1.5) * 1.2 * (0.4 + (a.mv || 0));

  // Shared defaults, then each animal's own body. Numbers are in design units (a T. rex's hip is 40 high).
  const SP = {};
  function vivid(hex, sat, lift) {
    if (typeof hex !== 'string' || hex[0] !== '#' || hex.length !== 7) return hex;
    let r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255, b = parseInt(hex.slice(5, 7), 16) / 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b); let h = 0, s2 = 0, l = (mx + mn) / 2;
    if (mx !== mn) { const d = mx - mn; s2 = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn); h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h /= 6; }
    s2 = Math.min(1, s2 * sat); l = Math.min(0.92, l + lift);
    const q = l < 0.5 ? l * (1 + s2) : l + s2 - l * s2, p2 = 2 * l - q, f = (t) => { t = (t + 1) % 1; return t < 1 / 6 ? p2 + (q - p2) * 6 * t : t < 0.5 ? q : t < 2 / 3 ? p2 + (q - p2) * (2 / 3 - t) * 6 : p2; };
    const to = (v) => Math.round(v * 255).toString(16).padStart(2, '0');
    return '#' + to(f(h + 1 / 3)) + to(f(h)) + to(f(h - 1 / 3));
  }
